---
dnf:
  remove:
    - toolbox
    - nano
    - ptyxis
    - nano-default-editor
    - gnome-tour
    - "gnome-shell-extension-*"
  coprs:
    - lilay/topgrade
    - trixieua/morewaita-icon-theme
    - iucar/rstudio
    - scottames/ghostty
  copr_packages:
    - ghostty
    - topgrade
    - morewaita-icon-theme
    - rstudio-server
  base:
    # Basic CLI Tools
    - vim
    - tmux
    - git
    - wget2
    - curl
    - htop
    - fastfetch
    - screen
    - xz
    - chezmoi
    - rsync
    - rclone
    - vim-enhanced
    - vim-default-editor
    # Containers
    - podman
    - podman-compose
    - distrobox
    - podlet
    - buildah
    - fuse
    - fuse-libs
    # Extra Tools
    - zsh
    - neovim
    - ripgrep
    - fd-find
    - fastfetch
    - bat
    - tldr
    # Desktop Integrations
    - adw-gtk3-theme
    - nautilus-python-devel
    - ffmpegthumbnailer
    - ddcutil
    - speech-dispatcher-utils
    - speech-dispatcher
    - xdg-terminal-exec
    - iio-sensor-proxy
    - waypipe
    - deskflow
    - syncthing
    - steam
    - gamescope
    - mangohud
    - discord
    # # BTRfs
    - btrfs-progs
    - btrfsmaintenance
    - snapper
    # # Networking and Infrastructure tools
    - wireshark
    - tcpdump
    - bind9-next-utils
    - socat
    - libvirt
    - qemu
    - ansible-core
    - kubernetes-client
    - helm
    - sqlite
    # # Git Tools
    - git
    - git-lfs
    - gh
    - glab
    - jq
    # # Build and developer toops
    - gcc
    - gcc-c++
    - make
    - cmake
    - ninja-build
    - clang
    - pkgconf-pkg-config
    - just
    - openssl-devel
    - zlib-devel
    - libffi-devel
    - sqlite-devel
    - readline-devel
    - bzip2-devel
    - xz-devel
    - java-latest-openjdk-devel
    - maven
    - gdb
    - valgrind
    - lldb
    - ccache
    - python3
    - python3-pip
    - python3-devel
    - pipx
    - uv
    - golang
    - rustup
    - nodejs
    - nodejs-npm
    - php-cli
    - composer
    - ruby
    - ruby-devel
    - rubygem-bundler
    # Scientific and numerical tools
    - octave
    - R-devel
    - libuv-devel
    # Installed from additional repos
    - code
    - tailscale
  latex:
    - texlive-scheme-basic
    - pandoc
  from_url:
    - https://storage.googleapis.com/minikube/releases/latest/minikube-latest.x86_64.rpm
gnome:
  extensions:
    - nightthemeswitcher@romainvigier.fr
    - caffeine@patapon.info
    - display-brightness-ddcutil@themightydeity.github.com
    - appindicatorsupport@rgcjonas.gmail.com
    - adwaita-colors-home@dpejoh
    - pip-on-top@rafostar.github.com
    - legacyschemeautoswitcher@joshimukul29.gmail.com
    - blur-my-shell@aunetx
    - nowplaying@epogonii.github.io
    - places-menu@gnome-shell-extensions.gcampax.github.com
