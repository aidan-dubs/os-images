on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
  push:
    branches:
      - main
    paths:
      - "fedora-iot/**"
      - "cosign/**"
      - ".forgejo/workflows/iot-build.yaml"
      - ".forgejo/workflows/bootc-build.yaml"
jobs:
  build:
    uses: ./.forgejo/workflows/bootc-build.yaml
    secrets: inherit
    with:
      image: iot
      context: fedora-iot
      variants: nvidia nvidia-legacy
