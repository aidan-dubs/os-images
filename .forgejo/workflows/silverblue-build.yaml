on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
  push:
    branches:
      - main
    paths:
      - "fedora-silverblue/**"
      - "cosign/**"
      - ".forgejo/workflows/silverblue-build.yaml"
      - ".forgejo/workflows/bootc-build.yaml"
jobs:
  build:
    uses: ./.forgejo/workflows/bootc-build.yaml
    secrets: inherit
    with:
      image: silverblue
      context: fedora-silverblue
      variants: nvidia
