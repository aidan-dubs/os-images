on: [push]
jobs:
  build-env:
    runs-on: runner
    container:
      image: quay.io/containers/buildah:v1.43
      volumes:
        - /home/runner/.local/share/containers:/var/lib/containers
    steps:
      - uses: actions/checkout@v7
      - run: buildah build -t ci-buildah:latest -f .forgejo/ci-image/Containerfile .forgejo/ci-image
  build:
    runs-on: runner
    container:
      image: ci-buildah:latest
      volumes:
        - con-cache:/var/lib/containers
        - tmp-cache:/var/tmp
    env:
      SERVER_URL: ${{ forgejo.server_url }}
      OWNER: ${{ forgejo.repository_owner }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          REGISTRY="${SERVER_URL#*://}"
          OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "REGISTRY=$REGISTRY" >> "$FORGEJO_ENV"
          echo "IMAGE=$REGISTRY/$OWNER/my-silverblue:latest" >> "$FORGEJO_ENV"
      - run: buildah login ${REGISTRY} --username $OWNER --password "${{ secrets.RUNNERTOKEN }}"
      - run: yq '.. | select(kind == "seq") | (path | join("_") | upcase) + "=\"" + (join(" ")) + "\""' ./fedora-silverblue/config.yaml > ./fedora-silverblue/argfile.conf
      - run: buildah build --build-arg-file ./fedora-silverblue/argfile.conf --target base -t ${IMAGE} -f Containerfile ./fedora-silverblue/
      - run: buildah push ${IMAGE}
