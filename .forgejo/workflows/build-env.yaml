on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - '.forgejo/ci-image/**'
      - '.forgejo/workflows/build-env.yaml'
jobs:
  build-env:
    runs-on: runner
    container:
      image: quay.io/containers/buildah:v1.43
      volumes:
        - /home/runner/.local/share/containers:/var/lib/containers
    steps:
      - run: dnf install -y git nodejs
      - uses: actions/checkout@v7
      - run: buildah build -t ci-buildah:latest -f .forgejo/ci-image/Containerfile .forgejo/ci-image
