on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
  push:
    branches:
      - main
    paths:
      - "fedora-kinoite/**"
      - "cosign/**"
      - ".forgejo/workflows/kinoite-build.yaml"
      - ".forgejo/workflows/bootc-build.yaml"
jobs:
  build:
    uses: ./.forgejo/workflows/bootc-build.yaml
    secrets: inherit
    with:
      image: kinoite
      context: fedora-kinoite
