on:
  push:
    branches:
      - main
    paths:
      - ".forgejo/ci-image/**"
      - ".forgejo/workflows/ci-buildah-build.yaml"
jobs:
  build-env:
    runs-on: runner
    container:
      image: quay.io/containers/buildah:v1.43
      volumes:
        - runner-cache:/var/lib/containers
    steps:
      - run: dnf install -y git nodejs
      - uses: actions/checkout@v7
      - run: >
          buildah build
          -t ci-buildah:latest
          -f .forgejo/ci-image/Containerfile
          .forgejo/ci-image
