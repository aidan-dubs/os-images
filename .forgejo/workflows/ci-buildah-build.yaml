on:
  push:
    branches:
      - main
    paths:
      - ".forgejo/ci-buildah/**"
      - ".forgejo/workflows/ci-buildah-build.yaml"
jobs:
  build-env:
    runs-on: runner
    container:
      # image: ${{ vars.CI_IMAGE }}
      image: quay.io/containers/buildah:v1.43 # Only needed for bootstrapping
    env:
      REGISTRY: ${{ vars.REGISTRY }}
      OWNER: ${{ vars.OWNER }}
      BOT_USER: ${{ vars.BOT_USER }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      IMAGE_NAME: ci-buildah
      BUILDAH_ISOLATION: chroot
    steps:
      - run: >
          buildah login "$REGISTRY"
          --username "$BOT_USER" --password "$BOT_TOKEN"
      - run: dnf install -y git nodejs # Only needed for bootstrapping
      - uses: actions/checkout@v7
      - run: >
          buildah build
          --layers
          --cache-from "$REGISTRY/$OWNER/$IMAGE_NAME/cache"
          --cache-to "$REGISTRY/$OWNER/$IMAGE_NAME/cache"
          -t "$REGISTRY/$OWNER/$IMAGE_NAME:latest"
          -f .forgejo/ci-buildah/Containerfile
          .forgejo/ci-buildah
      - run: >
          buildah push --digestfile ./digest
          "$REGISTRY/$OWNER/$IMAGE_NAME:latest"
