on: 
  push: 
    branches:
      - main
    paths:
      - ".forgejo/workflows/iso-iot.yaml"
jobs:
  build:
    runs-on: runner
    container:
      image: ghcr.io/osbuild/image-builder:latest
      options: --user root --cap-add=SYS_ADMIN --security-opt label=disable
      volumes:
        - con-cache:/var/lib/containers
        - tmp-cache:/var/tmp
    env:
      SERVER_URL: ${{ forgejo.server_url }}
      OWNER: ${{ forgejo.repository_owner }}
      BUILDAH_ISOLATION: chroot
      RUNNERTOKEN: ${{ secrets.RUNNERTOKEN }}
    steps:
      - run: |
          REGISTRY="${SERVER_URL#*://}"
          OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "REGISTRY=$REGISTRY" >> "$FORGEJO_ENV"
          echo "IMAGE=$REGISTRY/$OWNER/my-iot:latest" >> "$FORGEJO_ENV"
          echo "UNTAGGED_IMAGE=$REGISTRY/$OWNER/my-iot" >> "$FORGEJO_ENV"
      - run: podman login ${REGISTRY} --username $OWNER --password $RUNNERTOKEN
      - run: image-builder build --bootc-ref $IMAGE --bootc-default-fs btrfs generic-iso
      - run: |
          ISO="$(find . -name '*.iso' | head -n1)"
          VERSION="$(date +%Y%m%d)-${FORGEJO_SHA:0:7}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          curl --fail --user "$OWNER_LC:$RUNNERTOKEN" \
            --upload-file "$ISO" \
            "$SERVER_URL/api/packages/$OWNER_LC/generic/my-iot/$VERSION/my-iot.iso"
