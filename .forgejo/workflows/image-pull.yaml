on:
  schedule:
    - cron: '5 */6 * * *'
jobs:
  image-pull:
    runs-on: runner
    container:
      image: quay.io/podman/stable
      volumes:
        - con-cache:/var/lib/containers
        - tmp-cache:/var/tmp
    outputs:
      changed: ${{ steps.pull.outputs.changed }}
    steps:
      - name: Pull and compare image ID
        id: pull
        run: |
          IMG=quay.io/fedora/fedora-silverblue:45
          before=$(podman image inspect --format '{{.Id}}' "$IMG" 2>/dev/null || true)
          podman pull -q "$IMG"
          after=$(podman image inspect --format '{{.Id}}' "$IMG")
          if [ "$before" != "$after" ]; then
            echo "changed=true" >> "$FORGEJO_OUTPUT"
          else
            echo "changed=false" >> "$FORGEJO_OUTPUT"
          fi

  build:
    needs: image-pull
    if: needs.image-pull.outputs.changed == 'true'
    uses: ./.forgejo/workflows/build.yml

