on:
  push:
    branches:
      - main
    paths:
      - "anaconda-installer/**"
      - "cosign/**"
      - ".forgejo/workflows/silverblue-installer.yaml"
jobs:
  silverblue-installer-build:
    runs-on: runner
    container:
      image: ${{ vars.CI_IMAGE }}
    env:
      REGISTRY: ${{ vars.REGISTRY }}
      OWNER: ${{ vars.OWNER }}
      BOT_USER: ${{ vars.BOT_USER }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      IMAGE_NAME: silverblue-installer
      BUILDAH_ISOLATION: chroot
      UPDATE_AUTHFILE: ./update-auth.json
    steps:
      - uses: actions/checkout@v7
      - run: >
          buildah login "$REGISTRY"
          --username "$BOT_USER"
          --password "$BOT_TOKEN"
      - run: |
          printf '{}\n' > "$UPDATE_AUTHFILE"
          printf '%s' "$UPDATE_TOKEN" | buildah login \
            --authfile "$UPDATE_AUTHFILE" \
            --username "$OWNER" \
            --password-stdin "$REGISTRY"
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
      - run: >
          buildah build
          --layers
          --cache-from "$REGISTRY/$OWNER/$IMAGE_NAME/cache"
          --cache-to "$REGISTRY/$OWNER/$IMAGE_NAME/cache"
          --build-context cosign=./cosign/
          --build-arg "TARGET=$REGISTRY/$OWNER/silverblue:latest"
          --secret=id=ostree-auth,src="$UPDATE_AUTHFILE"
          -t "$REGISTRY/$OWNER/$IMAGE_NAME:latest"
          -f Containerfile ./anaconda-installer/
      - run: >
          buildah push --digestfile ./digest
          "$REGISTRY/$OWNER/$IMAGE_NAME:latest"
  iso:
    needs: silverblue-installer-build
    runs-on: runner
    container:
      image: ci-buildah:latest
      options: >
        --user root
        --userns=host
        --security-opt seccomp=unconfined
        --security-opt label=disable
        --cap-add=ALL
    env:
      SERVER_URL: ${{ forgejo.server_url }}
      REGISTRY: ${{ vars.REGISTRY }}
      OWNER: ${{ vars.OWNER }}
      BOT_USER: ${{ vars.BOT_USER }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      IMAGE_NAME: silverblue-installer
      AUTH_FILE: ./registry-auth.json
      REGISTRY_AUTH_FILE: ./registry-auth.json
      OUTPUT_DIR: ./iso-output
    steps:
      - uses: actions/checkout@v7
      - run: |
          printf '{}\n' > "$AUTH_FILE"
          printf '%s' "$BOT_TOKEN" | podman login \
            --authfile "$AUTH_FILE" \
            --username "$BOT_USER" \
            --password-stdin "$REGISTRY"
      - run: |
          ls -ln /usr/bin/mount
          find /usr/bin /usr/sbin -xdev -user 1008192 2>/dev/null | head
          chown root:root /usr/bin/mount && mount -t tmpfs tmpfs /mnt; echo "exit=$?"
      - run: >
          image-builder build bootc-generic-iso
          --output-dir "$OUTPUT_DIR"
          --output-name "$IMAGE_NAME"
          --bootc-ref "$REGISTRY/$OWNER/$IMAGE_NAME:latest"
          --bootc-default-fs btrfs
          --bootc-pull-container
      - run: |
          ISO_COUNT="$(find "$OUTPUT_DIR" -type f -name '*.iso' | wc -l)"
          if [ "$ISO_COUNT" -ne 1 ]; then
            echo "Expected one ISO artifact, found $ISO_COUNT" >&2
            exit 1
          fi
          ISO_PATH="$(find "$OUTPUT_DIR" -type f -name '*.iso' -print -quit)"
          PACKAGE_VERSION="$(git rev-parse --short=12 HEAD)-$(date -u +%Y%m%d%H%M%S)"
          curl --fail-with-body --show-error --silent \
            --user "$OWNER:$BOT_TOKEN" \
            --upload-file "$ISO_PATH" \
            "${SERVER_URL%/}/api/packages/$OWNER/generic/$IMAGE_NAME/$PACKAGE_VERSION/$(basename "$ISO_PATH")"
