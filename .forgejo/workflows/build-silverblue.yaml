on: 
  push: 
    branches:
      - main
    paths:
      - "fedora-silverblue/**"
      - ".forgejo/workflows/build-silverblue.yaml"
jobs:
  build:
    runs-on: runner
    container:
      image: ci-buildah:latest
      options: --cap-add=SYS_ADMIN --security-opt label=disable
      volumes:
        - con-cache:/var/lib/containers
        - tmp-cache:/var/tmp
    env:
      SERVER_URL: ${{ forgejo.server_url }}
      OWNER: ${{ forgejo.repository_owner }}
      BUILDAH_ISOLATION: chroot
    steps:
      - uses: actions/checkout@v7
      - run: |
          REGISTRY="${SERVER_URL#*://}"
          OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "REGISTRY=$REGISTRY" >> "$FORGEJO_ENV"
          echo "IMAGE=$REGISTRY/$OWNER/my-silverblue:latest" >> "$FORGEJO_ENV"
      - run: buildah login ${REGISTRY} --username $OWNER --password "${{ secrets.RUNNERTOKEN }}"
      - run: yq '.. | select(kind == "seq") | (path | join("_") | upcase) + "=" + (join(" "))' ./fedora-silverblue/config.yaml > ./fedora-silverblue/argfile.conf
      - run: findmnt -T /var/lib/containers -o TARGET,FSTYPE
      - run: buildah build --layers --build-arg-file ./fedora-silverblue/argfile.conf --target base -t ${IMAGE} -f Containerfile ./fedora-silverblue/
      - run: buildah push ${IMAGE}
