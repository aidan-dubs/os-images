on: 
  push: 
    branches:
      - main
    paths:
      - "fedora-silverblue/**"
      - ".forgejo/workflows/build-silverblue.yaml"
jobs:
  build:
    runs-on: runner
    container:
      image: ci-buildah:latest
      options: --user root --cap-add=SYS_ADMIN --security-opt label=disable
      volumes:
        - con-cache:/var/lib/containers
        - tmp-cache:/var/tmp
    env:
      SERVER_URL: ${{ forgejo.server_url }}
      OWNER: ${{ forgejo.repository_owner }}
      BUILDAH_ISOLATION: chroot
      STORAGE_DRIVER: btrfs
      CONTAINERS_STORAGE_CONF: /etc/containers/storage-ci.conf
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      RUNNERTOKEN: ${{ secrets.RUNNERTOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          REGISTRY="${SERVER_URL#*://}"
          OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "REGISTRY=$REGISTRY" >> "$FORGEJO_ENV"
          echo "IMAGE=$REGISTRY/$OWNER/my-silverblue:latest" >> "$FORGEJO_ENV"
          echo "UNTAGGED_IMAGE=$REGISTRY/$OWNER/my-silverblue" >> "$FORGEJO_ENV"
      - run: buildah login ${REGISTRY} --username $OWNER --password $RUNNERTOKEN
      - run: yq '.. | select(kind == "seq") | (path | join("_") | upcase) + "=" + (join(" "))' ./fedora-silverblue/config.yaml > ./fedora-silverblue/argfile.conf
      - run: buildah build --layers --build-contex cosign=./cosign/ --build-arg UNTAGGED_IMAGE --build-arg-file ./fedora-silverblue/argfile.conf --target base -t ${IMAGE} -f Containerfile ./fedora-silverblue/
      - run: buildah push --digestfile /tmp/digest ${IMAGE}
      - run: cosign login ${REGISTRY} --username $OWNER --password $RUNNERTOKEN
      - run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE%:*}@$(cat /tmp/digest)"
      - run: cosign verify --key cosign/cosign.pub "${IMAGE%:*}@$(cat /tmp/digest)"
