on:
  push:
    branches:
      - main
    paths:
      - "fedora-iot/**"
      - "cosign/**"
      - ".forgejo/workflows/build-iot.yaml"
jobs:
  build:
    runs-on: runner
    container:
      image: ci-buildah:latest
      options: --user root --cap-add=SYS_ADMIN --security-opt label=disable
      volumes:
        - con-cache:/var/lib/containers
        - tmp-cache:/var/tmp
    env:
      SERVER_URL: ${{ forgejo.server_url }}
      OWNER: ${{ forgejo.repository_owner }}
      BUILDAH_ISOLATION: chroot
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      RUNNERTOKEN: ${{ secrets.RUNNERTOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          REGISTRY="${SERVER_URL#*://}"
          OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "OWNER=$OWNER" >> "$FORGEJO_ENV"
          echo "REGISTRY=$REGISTRY" >> "$FORGEJO_ENV"
          echo "IMAGE=$REGISTRY/$OWNER/my-iot:latest" >> "$FORGEJO_ENV"
          echo "UNTAGGED_IMAGE=$REGISTRY/$OWNER/my-iot" >> "$FORGEJO_ENV"
      - run: >
          buildah login ${REGISTRY}
          --username ${OWNER} --password ${RUNNERTOKEN}
      - run: >
          yq '.. |
          select(kind == "seq") |
          (path | join("_") | upcase) + "=" + (join(" "))'
          ./fedora-iot/config.yaml > ./fedora-iot/argfile.conf
      - run: |
          UPDATE_AUTHFILE="$(mktemp /tmp/ostree-auth.XXXXXX)"
          printf '{}\n' > "$UPDATE_AUTHFILE"
          printf '%s' "$UPDATE_TOKEN" | buildah login \
            --authfile "$UPDATE_AUTHFILE" \
            --username "$OWNER" \
            --password-stdin "$REGISTRY"
          echo "UPDATE_AUTHFILE=$UPDATE_AUTHFILE" >> "$FORGEJO_ENV"
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
      - run: |
          trap 'rm -f -- "$UPDATE_AUTHFILE"' EXIT
          buildah build \
            --layers \
            --build-context cosign=./cosign/ \
            --build-arg REGISTRY=${REGISTRY} \
            --build-arg UNTAGGED_IMAGE=${UNTAGGED_IMAGE} \
            --secret=id=ostree-auth,src=${UPDATE_AUTHFILE} \
            --build-arg-file ./fedora-iot/argfile.conf \
            --target base -t ${IMAGE} \
            -f Containerfile ./fedora-iot/
      - run: buildah push --digestfile /tmp/digest ${IMAGE}
      - run: >
          cosign login ${REGISTRY}
          --username $OWNER
          --password $RUNNERTOKEN
      - run: >
          cosign sign --yes
          --key env://COSIGN_PRIVATE_KEY
          "${IMAGE%:*}@$(cat /tmp/digest)"
      - run: >
          cosign verify
          --key cosign/cosign.pub
          "${IMAGE%:*}@$(cat /tmp/digest)"
